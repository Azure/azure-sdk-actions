name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      - run: go test .
